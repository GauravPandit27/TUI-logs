[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "neolog"
version         = "0.1.0"
description     = "Real-time structured log viewer and system monitor TUI for developers"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }
authors         = [{ name = "Gaurav Pandit", email = "gauravpandit27@gmail.com" }]
keywords        = ["logging", "tui", "terminal", "monitor", "devtools", "tracing", "json"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "textual>=0.82.0",
    "rich>=13.7.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pyrefly",
]

[project.urls]
Homepage      = "https://github.com/GauravPandit27/TUI-logs"
Repository    = "https://github.com/GauravPandit27/TUI-logs"
"Bug Tracker" = "https://github.com/GauravPandit27/TUI-logs/issues"

# ── CLI entry point ─────────────────────────────────────────────────────────
[project.scripts]
neolog = "neolog.__main__:main"

# ── Package discovery ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["neolog*"]

[tool.setuptools.package-data]
neolog = ["*.tcss"]
